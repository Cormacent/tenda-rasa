services:
  postgres:
    image: postgres:15
    container_name: postgres_app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PG_PORT_OUTSIDE}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres_n8n:
    image: postgres:15
    container_name: postgres_n8n
    environment:
      POSTGRES_USER: ${N8N_POSTGRES_USER}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      POSTGRES_DB: ${N8N_POSTGRES_DB}
    volumes:
      - postgres-n8n-data:/var/lib/postgresql/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres_n8n
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: Asia/Jakarta
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: ${WEBHOOK_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - postgres_n8n
    restart: unless-stopped

  tenda-rasa-be:
    build:
      context: ../tenda-rasa-be  # Pastikan folder ini punya Dockerfile & source code
    container_name: tenda_rasa_be
    command: npm run dev
    env_file:
      - .env
    ports:
      - "${BE_PORT}:${BE_PORT}"
    volumes:
      - ../tenda-rasa-be:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: ${BE_PORT}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  
  redis:
    image: redis:7
    container_name: redis_app
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped


volumes:
  postgres-data:
  postgres-n8n-data:
  n8n-data:
  redis-data: