services:
  postgres:
    image: postgres:15
    container_name: postgres_app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PG_PORT_OUTSIDE}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    restart: unless-stopped

  postgres_n8n:
    image: postgres:15
    container_name: postgres_n8n
    environment:
      POSTGRES_USER: ${N8N_POSTGRES_USER}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      POSTGRES_DB: ${N8N_POSTGRES_DB}
    volumes:
      - postgres-n8n-data:/var/lib/postgresql/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres_n8n
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: Asia/Jakarta
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - postgres_n8n
    restart: unless-stopped

  tenda-rasa-socket:
    build:
      context: ../tenda-rasa-socket  # Sesuaikan path ke folder back-end
    container_name: tenda_rasa_socket
    ports:
      - "${BE_SOCKET_PORT}:3000"
    volumes:
      - ../tenda-rasa-socket:/app
    env_file:
      - .env
    environment:
      NODE_ENV: development
    restart: unless-stopped
    depends_on:
      - postgres

  tenda-rasa-be:
    build:
      context: ../tenda-rasa-be  # Pastikan folder ini punya Dockerfile & source code
    container_name: tenda_rasa_be
    env_file:
      - .env
    ports:
      - "${BE_PORT}:${BE_PORT}"
    volumes:
      - ../tenda-rasa-be:/app
    environment:
      NODE_ENV: development
      POSTGRES_HOST: ${POSTGRES_HOST}
    restart: unless-stopped


volumes:
  postgres-data:
  postgres-n8n-data:
  n8n-data: