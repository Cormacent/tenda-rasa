version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres_app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis_app
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tenda-rasa-be:
    image: ghcr.io/cormacent/tenda-rasa/tenda-rasa-be:prod
    container_name: tenda_rasa_be
    env_file:
      - .env.prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  tenda-rasa-fe:
    image: ghcr.io/cormacent/tenda-rasa/tenda-rasa-fe:prod
    container_name: tenda_rasa_fe
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
