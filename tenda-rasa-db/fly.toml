app = 'tenda-rasa-db'
primary_region = 'sin'

[build]

[env]
  POSTGRES_DB = 'tenda_rasa'
  POSTGRES_USER = 'postgres'
  PGDATA = '/data/pg'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 5432
  force_https = true
  auto_stop_machines = "stop"         # stop otomatis
  auto_start_machines = true
  min_machines_running = 1            # selalu nyala minimal 1 VM
  processes = ['app']
  idle_timeout = "30m"                # baru mati setelah idle 30 menit

[[services]]
  protocol = 'tcp'
  internal_port = 5432

  [[services.ports]]
    port = 5432

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[checks]
[checks.pg]
  type = "tcp"
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  port = 5432

[experimental]
  auto_stop_machines = "stop"         # sama seperti di http_service
  auto_start_machines = true
  min_machines_running = 1
  idle_timeout = "30m"                # idle timeout 30 menit

[scale]
  count = 1